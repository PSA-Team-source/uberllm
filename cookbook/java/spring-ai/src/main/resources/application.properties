# UberLLM through Spring AI's OpenAI starter.
# Model ids and live prices: https://uberllm.dev/models
spring.ai.openai.base-url=https://api.uberllm.dev/v1
spring.ai.openai.api-key=${UBERLLM_API_KEY}
spring.ai.openai.chat.model=${UBERLLM_MODEL:deepseek/deepseek-v4-flash}

# UberLLM has no embeddings or moderation endpoint; turn those beans off.
spring.ai.model.embedding=none
spring.ai.model.moderation=none

spring.main.web-application-type=none
spring.main.banner-mode=off
logging.level.root=warn
